# ── Blue-Green Deployment ─────────────────────────────────────
# Blue = current live version (Service points here by default)
# Green = new version standing by (no traffic until switch)
#
# To switch traffic to green:
#   kubectl patch service aceest-service \
#     -p '{"spec":{"selector":{"version":"green"}}}'
#
# To rollback to blue:
#   kubectl patch service aceest-service \
#     -p '{"spec":{"selector":{"version":"blue"}}}'

# BLUE — current live
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  labels:
    app: aceest
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest
      version: blue
  template:
    metadata:
      labels:
        app: aceest
        version: blue
    spec:
      containers:
        - name: aceest
          image: aceest-fitness:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# GREEN — new version standing by
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  labels:
    app: aceest
    version: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest
      version: green
  template:
    metadata:
      labels:
        app: aceest
        version: green
    spec:
      containers:
        - name: aceest
          image: aceest-fitness:latest   # point to new build tag
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Service — selector set to blue by default
apiVersion: v1
kind: Service
metadata:
  name: aceest-service
spec:
  selector:
    app: aceest
    version: blue     # patch to "green" to cut over
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
