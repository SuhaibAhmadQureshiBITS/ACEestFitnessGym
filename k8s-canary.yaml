# ── Canary Release Deployment ─────────────────────────────────
# 9 stable pods + 1 canary pod = ~10% traffic to new version
# Both share the same Service via app: aceest label
# To promote canary: scale stable to 0, canary to 3
# To rollback: kubectl scale deployment aceest-canary --replicas=0

# Stable (existing version — keep running)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  labels:
    app: aceest
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: aceest
      track: stable
  template:
    metadata:
      labels:
        app: aceest
        track: stable
    spec:
      containers:
        - name: aceest
          image: aceest-fitness:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Canary (new version — ~10% traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  labels:
    app: aceest
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: canary
  template:
    metadata:
      labels:
        app: aceest
        track: canary
    spec:
      containers:
        - name: aceest
          image: aceest-fitness:latest   # point to new build tag
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Shared Service — routes to both stable + canary via app: aceest
apiVersion: v1
kind: Service
metadata:
  name: aceest-service
spec:
  selector:
    app: aceest
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
