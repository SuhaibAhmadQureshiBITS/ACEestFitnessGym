# ── Rolling Update Deployment ─────────────────────────────────
# Default strategy: zero-downtime gradual pod replacement
# Image name matches Jenkinsfile: aceest-fitness:<BUILD_NUMBER>
# kubectl apply -f k8s-rolling.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  labels:
    app: aceest
    strategy: rolling
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 1 extra pod allowed during update
      maxUnavailable: 0  # never take a pod down before new one is ready
  template:
    metadata:
      labels:
        app: aceest
    spec:
      containers:
        - name: aceest
          image: 050916357370.dkr.ecr.ap-south-1.amazonaws.com/aceest-fitness:latest 
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_APP
              value: app.py
            - name: FLASK_RUN_HOST
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Canary (new version — ~10% traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  labels:
    app: aceest
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: canary
  template:
    metadata:
      labels:
        app: aceest
        track: canary
    spec:
      containers:
        - name: aceest
          image: 050916357370.dkr.ecr.ap-south-1.amazonaws.com/aceest-fitness:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-service
spec:
  selector:
    app: aceest
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
