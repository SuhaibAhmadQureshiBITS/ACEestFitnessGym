# ── SonarQube Project Configuration ──────────────────────────
# ACEest Fitness & Gym Management System
# Run: sonar-scanner (from project root)

sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness API
sonar.projectVersion=1.0

# Source and test files (flat structure — no subdirectories)
sonar.sources=app.py
sonar.tests=test_app.py
sonar.language=py

# Coverage and test reports generated by pytest-cov
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,aceest_fitness.db
